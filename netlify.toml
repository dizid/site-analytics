[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content policy in REPORT-ONLY mode (T-0634, Nov 19 2026): nothing is blocked yet;
    # browsers send violations to /api/csp-report (Netlify function log). Enforce later by
    # renaming the header to Content-Security-Policy once the log stays clean.
    # script-src: own files + the inline session check in index.html (by hash; run
    # `node scripts/csp-hash.mjs` after changing that script). img-src allows any https
    # image (Google profile pictures). All API calls stay on this domain.
    # Fonts are self-hosted since T-0636 (Nov 20 2026), so no Google Fonts origins.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'sha256-I0KIaDYhsCw7BDxk0Ah1iYxLkXUOjyDOwr/Hqxb19DI='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report"

[[redirects]]
  from = "/api/oauth/authorize"
  to = "/.netlify/functions/oauth-authorize"
  status = 200

[[redirects]]
  from = "/api/oauth/callback"
  to = "/.netlify/functions/oauth-callback"
  status = 200

[[redirects]]
  from = "/api/oauth/logout"
  to = "/.netlify/functions/oauth-logout"
  status = 200

[[redirects]]
  from = "/api/analytics-detail"
  to = "/.netlify/functions/analytics-detail"
  status = 200

[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200

[[redirects]]
  from = "/api/cloudflare"
  to = "/.netlify/functions/cloudflare"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Any other path: a real 404 (public/404.html). The app has no client-side routes (everything,
# incl. the OAuth return with #error=..., lands on "/"), so the old SPA fallback to index.html
# only turned typos and missing files (e.g. /llms.txt before T-0401) into soft 404s.
# A future client-side path needs its own rule above this one.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
